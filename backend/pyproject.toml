[project]
name = "dataforge"
version = "0.1.0"
description = "Visual test data generator from DDL and Cypher schemas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlglot>=25.0",
    "lark>=1.2",
    "faker>=26.0",
    "duckdb>=1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
graph = [
    "kuzu>=0.6",
]
ai = [
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselect with '-m not slow')"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]
